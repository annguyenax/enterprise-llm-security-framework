<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="1100" height="520" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#0F2A43" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#E05260"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#22C55E"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#F7F9FC"/>

  <text x="40" y="45" font-size="20" font-weight="700" fill="#0F2A43">HÌNH 4 — KHUNG SO SÁNH A/B EVALUATION (WITH VS WITHOUT GUARD)</text>
  <rect x="40" y="55" width="280" height="4" rx="2" fill="#14B8A6"/>

  <!-- KHỐI TRUNG TÂM DÙNG CHUNG -->
  <g transform="translate(40, 185)">
    <rect width="250" height="110" rx="12" fill="#FFFFFF" stroke="#14B8A6" stroke-width="2.5" filter="url(#shadow)"/>
    <svg x="16" y="16" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#14B8A6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/>
    </svg>
    <text x="130" y="45" font-size="15" font-weight="700" fill="#0F2A43" text-anchor="middle">RAG Retrieval + ACL</text>
    <rect x="65" y="58" width="130" height="22" rx="4" fill="#CCFBF1"/>
    <text x="130" y="73" font-size="11" font-weight="700" fill="#0F2A43" text-anchor="middle">(DÙNG CHUNG)</text>
  </g>

  <!-- Split paths -->
  <path d="M 290 240 L 330 240 L 330 130 L 360 130" stroke="#22C55E" stroke-width="2" fill="none" marker-end="url(#arrow-green)"/>
  <path d="M 290 240 L 330 240 L 330 350 L 360 350" stroke="#E05260" stroke-width="2" stroke-dasharray="6,4" fill="none" marker-end="url(#arrow-red)"/>

  <!-- LUỒNG TRÊN: CÓ TƯỜNG -->
  <g transform="translate(370, 90)">
    <rect x="0" y="-20" width="100" height="22" rx="4" fill="#DCFCE7"/>
    <text x="50" y="-5" font-size="11" font-weight="700" fill="#15803D" text-anchor="middle">CÓ TƯỜNG</text>

    <rect width="200" height="80" rx="12" fill="#FFFFFF" stroke="#22C55E" stroke-width="1.5" filter="url(#shadow)"/>
    <svg x="16" y="16" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#22C55E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
    </svg>
    <text x="50" y="38" font-size="15" font-weight="700" fill="#0F2A43">Chuỗi Guard</text>
    <text x="50" y="58" font-size="12" fill="#64748B">Security Inspection</text>
  </g>

  <path d="M 570 130 L 610 130" stroke="#22C55E" stroke-width="2" fill="none" marker-end="url(#arrow-green)"/>

  <g transform="translate(620, 90)">
    <rect width="160" height="80" rx="12" fill="#FFFFFF" stroke="#0F2A43" stroke-width="1.5" filter="url(#shadow)"/>
    <svg x="16" y="16" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0F2A43" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M15 2v2M15 20v2M2 15h2M2 9h2M20 15h2M20 9h2M9 2v2M9 20v2"/>
    </svg>
    <text x="50" y="38" font-size="15" font-weight="700" fill="#0F2A43">LLM</text>
    <text x="50" y="58" font-size="12" fill="#64748B">Protected</text>
  </g>

  <!-- LUỒNG DƯỚI: KHÔNG TƯỜNG -->
  <g transform="translate(370, 310)">
    <rect x="0" y="-20" width="115" height="22" rx="4" fill="#FEE2E2"/>
    <text x="57" y="-5" font-size="11" font-weight="700" fill="#E05260" text-anchor="middle">KHÔNG TƯỜNG</text>

    <rect width="200" height="80" rx="12" fill="#FFFFFF" stroke="#E05260" stroke-width="1.5" stroke-dasharray="5,4" filter="url(#shadow)"/>
    <svg x="16" y="16" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#E05260" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 6 6 18"/><path d="m6 6 12 12"/>
    </svg>
    <text x="50" y="38" font-size="14" font-weight="700" fill="#E05260">bỏ qua guard</text>
    <text x="50" y="58" font-size="12" fill="#64748B">Direct Pass-through</text>
  </g>

  <path d="M 570 350 L 610 350" stroke="#E05260" stroke-width="2" stroke-dasharray="6,4" fill="none" marker-end="url(#arrow-red)"/>

  <g transform="translate(620, 310)">
    <rect width="160" height="80" rx="12" fill="#FFFFFF" stroke="#0F2A43" stroke-width="1.5" filter="url(#shadow)"/>
    <svg x="16" y="16" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0F2A43" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M15 2v2M15 20v2M2 15h2M2 9h2M20 15h2M20 9h2M9 2v2M9 20v2"/>
    </svg>
    <text x="50" y="38" font-size="15" font-weight="700" fill="#0F2A43">LLM</text>
    <text x="50" y="58" font-size="12" fill="#64748B">Unprotected</text>
  </g>

  <!-- Output Merge -->
  <path d="M 780 130 L 820 130 L 820 240 L 850 240" stroke="#22C55E" stroke-width="2" fill="none" marker-end="url(#arrow-green)"/>
  <path d="M 780 350 L 820 350 L 820 240 L 850 240" stroke="#E05260" stroke-width="2" stroke-dasharray="6,4" fill="none" marker-end="url(#arrow-red)"/>

  <g transform="translate(860, 195)">
    <rect width="180" height="90" rx="12" fill="#FFFFFF" stroke="#0F2A43" stroke-width="1.5" filter="url(#shadow)"/>
    <svg x="16" y="16" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0F2A43" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/>
    </svg>
    <text x="90" y="48" font-size="15" font-weight="700" fill="#0F2A43" text-anchor="middle">Phản hồi</text>
    <text x="90" y="68" font-size="12" fill="#64748B" text-anchor="middle">A/B Output Compare</text>
  </g>

  <!-- Chú thích -->
  <g transform="translate(40, 440)">
    <rect width="1000" height="40" rx="8" fill="#F1F5F9" stroke="#64748B" stroke-width="1"/>
    <svg x="16" y="10" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#14B8A6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/>
    </svg>
    <text x="48" y="25" font-size="13" font-weight="700" fill="#0F2A43">Chung một cơ chế RAG → so sánh công bằng (apples-to-apples)</text>
  </g>
</svg>
