  <rect width="100%" height="100%" fill="#F7F9FC"/>

  <text x="40" y="45" font-size="20" font-weight="700" fill="#0F2A43">HÌNH 5 — MÔ HÌNH MỐI ĐE DOẠ (THREAT MODEL &amp; OWASP MAPPING)</text>
  <rect x="40" y="55" width="280" height="4" rx="2" fill="#14B8A6"/>

