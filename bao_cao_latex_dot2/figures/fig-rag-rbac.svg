<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#0F2A43" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748B"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#F7F9FC"/>

  <text x="40" y="45" font-size="20" font-weight="700" fill="#0F2A43">HÌNH 3 — TRUY HỒI LAI (HYBRID RETRIEVAL) + RBAC CONTROL</text>
  <rect x="40" y="55" width="260" height="4" rx="2" fill="#14B8A6"/>

  <!-- Node 1: Câu hỏi -->
  <g transform="translate(40, 200)">
    <rect width="140" height="90" rx="12" fill="#FFFFFF" stroke="#0F2A43" stroke-width="1.5" filter="url(#shadow)"/>
    <svg x="14" y="14" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0F2A43" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
    </svg>
    <text x="70" y="52" font-size="15" font-weight="700" fill="#0F2A43" text-anchor="middle">Câu hỏi</text>
    <text x="70" y="72" font-size="12" fill="#64748B" text-anchor="middle">User Query</text>
  </g>

  <path d="M 180 245 L 212 245" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- Node 2: ACL / RBAC -->
  <g transform="translate(220, 185)">
    <rect width="250" height="120" rx="12" fill="#FFFFFF" stroke="#14B8A6" stroke-width="2" filter="url(#shadow)"/>
    <svg x="16" y="16" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#14B8A6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
    </svg>
    <text x="130" y="45" font-size="15" font-weight="700" fill="#0F2A43" text-anchor="middle">ACL theo vai trò/phòng ban</text>
    <text x="130" y="68" font-size="13" font-weight="600" fill="#14B8A6" text-anchor="middle">lọc tài liệu được phép</text>
    <text x="130" y="90" font-size="11" fill="#64748B" text-anchor="middle">Role-Based Access Control</text>
  </g>

  <!-- Parallel Branching -->
  <path d="M 470 245 L 500 245 L 500 150 L 530 150" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 470 245 L 500 245 L 500 340 L 530 340" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- LÀN TRÊN: BM25 -->
  <g transform="translate(540, 90)">
    <rect width="320" height="120" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5" filter="url(#shadow)"/>
    <svg x="16" y="16" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3B82F6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/>
    </svg>
    <text x="50" y="38" font-size="15" font-weight="700" fill="#0F2A43">BM25 · từ khoá</text>
    <text x="50" y="60" font-size="12" fill="#64748B">Sparse Keyword Matching</text>
  </g>

  <!-- LÀN DƯỚI: Cosine Embedding -->
  <g transform="translate(540, 280)">
    <rect width="320" height="120" rx="12" fill="#F0FDF4" stroke="#14B8A6" stroke-width="1.5" filter="url(#shadow)"/>
    <svg x="16" y="16" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#14B8A6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M15 2v2M15 20v2M2 15h2M2 9h2M20 15h2M20 9h2M9 2v2M9 20v2"/>
    </svg>
    <text x="50" y="38" font-size="15" font-weight="700" fill="#0F2A43">Cosine embedding</text>
    <text x="50" y="58" font-size="13" font-weight="600" fill="#14B8A6">nhân ma trận numpy</text>

    <!-- Sub-tag chú thích -->
    <rect x="16" y="75" width="288" height="30" rx="6" fill="#FFFFFF" stroke="#14B8A6" stroke-width="1"/>
    <text x="160" y="94" font-size="11" font-weight="600" fill="#0F2A43" text-anchor="middle">vector float32 · BLOB · một phép nhân ma trận</text>
  </g>

  <path d="M 860 150 L 890 150 L 890 245 L 910 245" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 860 340 L 890 340 L 890 245 L 910 245" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- Merge Node -->
  <g transform="translate(920, 190)">
    <rect width="110" height="110" rx="12" fill="#FFFFFF" stroke="#0F2A43" stroke-width="1.5" filter="url(#shadow)"/>
    <svg x="14" y="12" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0F2A43" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="18" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><path d="M6 21V9a9 9 0 0 0 9 9"/>
    </svg>
    <text x="55" y="52" font-size="13" font-weight="700" fill="#0F2A43" text-anchor="middle">Hợp nhất</text>
    <text x="55" y="70" font-size="12" font-weight="700" fill="#14B8A6" text-anchor="middle">RRF</text>
  </g>

  <path d="M 1030 245 L 1052 245" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- Output Node -->
  <g transform="translate(1060, 200)">
    <rect width="110" height="90" rx="12" fill="#FFFFFF" stroke="#22C55E" stroke-width="1.5" filter="url(#shadow)"/>
    <svg x="12" y="12" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#22C55E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/>
    </svg>
    <text x="55" y="50" font-size="13" font-weight="700" fill="#0F2A43" text-anchor="middle">Top-k</text>
    <text x="55" y="68" font-size="13" font-weight="700" fill="#22C55E" text-anchor="middle">tài liệu</text>
  </g>
</svg>
