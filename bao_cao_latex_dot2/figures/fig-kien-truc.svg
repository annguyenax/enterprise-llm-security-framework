<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1350 560" width="1350" height="560" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#0F2A43" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748B"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#14B8A6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#F7F9FC"/>

  <!-- Title & Accent Line -->
  <text x="40" y="45" font-size="20" font-weight="700" fill="#0F2A43">HÌNH 1 — KIẾN TRÚC TỔNG THỂ HỆ THỐNG SECURITY GUARD</text>
  <rect x="40" y="55" width="220" height="4" rx="2" fill="#14B8A6"/>

  <!-- TẦNG 1: Người dùng -->
  <g transform="translate(40, 220)">
    <rect width="160" height="120" rx="12" fill="#FFFFFF" stroke="#0F2A43" stroke-width="1.5" filter="url(#shadow)"/>
    <svg x="16" y="16" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0F2A43" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
    </svg>
    <text x="80" y="70" font-size="15" font-weight="700" fill="#0F2A43" text-anchor="middle">Người dùng</text>
    <text x="80" y="92" font-size="12" fill="#64748B" text-anchor="middle">End User / Client</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 200 280 L 232 280" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- TẦNG 2: Gateway -->
  <g transform="translate(240, 220)">
    <rect width="170" height="120" rx="12" fill="#FFFFFF" stroke="#0F2A43" stroke-width="1.5" filter="url(#shadow)"/>
    <svg x="16" y="16" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0F2A43" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M15 2v2M15 20v2M2 15h2M2 9h2M20 15h2M20 9h2M9 2v2M9 20v2"/>
    </svg>
    <text x="85" y="65" font-size="15" font-weight="700" fill="#0F2A43" text-anchor="middle">Gateway</text>
    <text x="85" y="87" font-size="13" font-weight="600" fill="#14B8A6" text-anchor="middle">(FastAPI)</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 410 280 L 442 280" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- TẦNG 3: Khung CHUỖI GUARD -->
  <g transform="translate(450, 90)">
    <rect width="280" height="380" rx="16" fill="#F1F5F9" stroke="#14B8A6" stroke-width="1.5"/>
    <text x="140" y="32" font-size="14" font-weight="700" fill="#0F2A43" text-anchor="middle" letter-spacing="1">CHUỖI GUARD</text>
    <rect x="100" y="40" width="80" height="3" rx="1.5" fill="#14B8A6"/>

    <!-- Guard 1: Input Guard -->
    <g transform="translate(20, 55)">
      <rect width="240" height="68" rx="10" fill="#FFFFFF" stroke="#0F2A43" stroke-width="1.5" filter="url(#shadow)"/>
      <svg x="14" y="14" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0F2A43" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      </svg>
      <text x="46" y="28" font-size="14" font-weight="700" fill="#0F2A43">Input Guard</text>
      <text x="46" y="48" font-size="11" fill="#64748B">Lọc Prompt Injection / Jailbreak</text>
    </g>

    <!-- Guard 2: RAG Context Guard -->
    <g transform="translate(20, 133)">
      <rect width="240" height="68" rx="10" fill="#FFFFFF" stroke="#0F2A43" stroke-width="1.5" filter="url(#shadow)"/>
      <svg x="14" y="14" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0F2A43" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/>
      </svg>
      <text x="46" y="28" font-size="14" font-weight="700" fill="#0F2A43">RAG Context Guard</text>
      <text x="46" y="48" font-size="11" fill="#64748B">Kiểm tra ngữ cảnh &amp; Poisoning</text>
    </g>

    <!-- Guard 3: Output/DLP Guard -->
    <g transform="translate(20, 211)">
      <rect width="240" height="68" rx="10" fill="#FFFFFF" stroke="#0F2A43" stroke-width="1.5" filter="url(#shadow)"/>
      <svg x="14" y="14" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0F2A43" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
      <text x="46" y="28" font-size="14" font-weight="700" fill="#0F2A43">Output/DLP Guard</text>
      <text x="46" y="48" font-size="11" fill="#64748B">Chống rò rỉ PII / Sensitive Data</text>
    </g>

    <!-- Guard 4: Semantic Judge -->
    <g transform="translate(20, 289)">
      <rect width="240" height="68" rx="10" fill="#FFFFFF" stroke="#0F2A43" stroke-width="1.5" filter="url(#shadow)"/>
      <svg x="14" y="14" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0F2A43" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 4.44-2.04Z"/><path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96.44 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.24 2.5 2.5 0 0 0-4.44-2.04Z"/>
      </svg>
      <text x="46" y="28" font-size="14" font-weight="700" fill="#0F2A43">Semantic Judge</text>
      <text x="46" y="48" font-size="11" fill="#64748B">Đánh giá ngữ nghĩa &amp; An toàn</text>
    </g>
  </g>

  <!-- Arrow 3 -> 4 -->
  <path d="M 730 280 L 762 280" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- TẦNG 4: Truy hồi lai + SQLite -->
  <g transform="translate(770, 215)">
    <rect width="210" height="130" rx="12" fill="#FFFFFF" stroke="#0F2A43" stroke-width="1.5" filter="url(#shadow)"/>
    <svg x="16" y="16" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0F2A43" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/>
    </svg>
    <text x="105" y="60" font-size="15" font-weight="700" fill="#0F2A43" text-anchor="middle">Truy hồi lai</text>
    <text x="105" y="82" font-size="13" font-weight="600" fill="#14B8A6" text-anchor="middle">(BM25 + Embedding)</text>
    <text x="105" y="104" font-size="11" fill="#64748B" text-anchor="middle">Hybrid Search Engine</text>
  </g>

  <!-- Thẻ SQLite nằm trên -->
  <g transform="translate(785, 95)">
    <rect width="180" height="70" rx="10" fill="#FFFFFF" stroke="#14B8A6" stroke-width="1.5" filter="url(#shadow)"/>
    <svg x="12" y="12" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#14B8A6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/>
    </svg>
    <text x="38" y="26" font-size="13" font-weight="700" fill="#0F2A43">SQLite</text>
    <text x="38" y="46" font-size="11" fill="#64748B">vector float32 BLOB</text>
  </g>

  <!-- Mũi tên 2 chiều giữa Truy hồi lai & SQLite -->
  <path d="M 875 215 L 875 173" stroke="#14B8A6" stroke-width="2" fill="none" marker-end="url(#arrow-teal)" marker-start="url(#arrow-teal)"/>

  <!-- Arrow 4 -> 5 -->
  <path d="M 980 280 L 1012 280" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- TẦNG 5: LLM & Phản hồi -->
  <g transform="translate(1020, 150)">
    <rect width="180" height="100" rx="12" fill="#FFFFFF" stroke="#0F2A43" stroke-width="1.5" filter="url(#shadow)"/>
    <svg x="16" y="16" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0F2A43" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M15 2v2M15 20v2M2 15h2M2 9h2M20 15h2M20 9h2M9 2v2M9 20v2"/>
    </svg>
    <text x="90" y="55" font-size="15" font-weight="700" fill="#0F2A43" text-anchor="middle">LLM</text>
    <text x="90" y="77" font-size="13" font-weight="600" fill="#14B8A6" text-anchor="middle">(Mock/Ollama)</text>
  </g>

  <path d="M 1110 250 L 1110 302" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <g transform="translate(1010, 310)">
    <rect width="200" height="100" rx="12" fill="#FFFFFF" stroke="#22C55E" stroke-width="1.5" filter="url(#shadow)"/>
    <svg x="16" y="16" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#22C55E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/>
    </svg>
    <text x="100" y="52" font-size="14" font-weight="700" fill="#0F2A43" text-anchor="middle">Phản hồi</text>
    <text x="100" y="72" font-size="13" font-weight="600" fill="#22C55E" text-anchor="middle">đã kiểm soát</text>
  </g>
</svg>
