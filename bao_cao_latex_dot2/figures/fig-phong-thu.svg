<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 820" width="900" height="820" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#0F2A43" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#22C55E"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#E05260"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#F7F9FC"/>

  <text x="40" y="45" font-size="20" font-weight="700" fill="#0F2A43">HÌNH 2 — CHUỖI PHÒNG THỦ NHIỀU LỚP (FAIL-CLOSED PIPELINE)</text>
  <rect x="40" y="55" width="280" height="4" rx="2" fill="#14B8A6"/>

  <!-- Guard 1: Input Guard -->
  <g transform="translate(180, 100)">
    <rect width="220" height="80" rx="12" fill="#FFFFFF" stroke="#0F2A43" stroke-width="1.5" filter="url(#shadow)"/>
    <svg x="16" y="16" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0F2A43" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
    </svg>
    <text x="50" y="38" font-size="15" font-weight="700" fill="#0F2A43">Input Guard</text>
    <text x="50" y="58" font-size="12" fill="#64748B">Kiểm tra Prompt Input</text>
  </g>

  <!-- Branch 1 RED -->
  <path d="M 400 140 Q 520 140 520 140 L 550 140" stroke="#E05260" stroke-width="2" fill="none" marker-end="url(#arrow-red)"/>
  <rect x="425" y="120" width="90" height="22" rx="4" fill="#FEE2E2"/>
  <text x="470" y="135" font-size="11" font-weight="700" fill="#E05260" text-anchor="middle">Block / Reject</text>

  <g transform="translate(560, 110)">
    <rect width="260" height="60" rx="30" fill="#FFFFFF" stroke="#E05260" stroke-width="1.5" filter="url(#shadow)"/>
    <svg x="16" y="18" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#E05260" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><line x1="9.5" y1="9.5" x2="14.5" y2="14.5"/><line x1="14.5" y1="9.5" x2="9.5" y2="14.5"/>
    </svg>
    <text x="52" y="30" font-size="13" font-weight="700" fill="#E05260">DỪNG</text>
    <text x="52" y="46" font-size="11" fill="#64748B">giữ lại câu trả lời / báo lỗi</text>
  </g>

  <!-- Down Arrow 1 GREEN -->
  <path d="M 290 180 L 290 238" stroke="#22C55E" stroke-width="2" fill="none" marker-end="url(#arrow-green)"/>
  <rect x="298" y="198" width="105" height="22" rx="4" fill="#DCFCE7"/>
  <text x="350" y="213" font-size="11" font-weight="700" fill="#15803D" text-anchor="middle">Allow / Sanitize</text>

  <!-- Guard 2: RAG Context Guard -->
  <g transform="translate(180, 240)">
    <rect width="220" height="80" rx="12" fill="#FFFFFF" stroke="#0F2A43" stroke-width="1.5" filter="url(#shadow)"/>
    <svg x="16" y="16" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0F2A43" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/>
    </svg>
    <text x="50" y="38" font-size="15" font-weight="700" fill="#0F2A43">RAG Context Guard</text>
    <text x="50" y="58" font-size="12" fill="#64748B">Lọc dữ liệu truy hồi</text>
  </g>

  <!-- Branch 2 RED -->
  <path d="M 400 280 L 550 280" stroke="#E05260" stroke-width="2" fill="none" marker-end="url(#arrow-red)"/>
  <rect x="425" y="260" width="90" height="22" rx="4" fill="#FEE2E2"/>
  <text x="470" y="275" font-size="11" font-weight="700" fill="#E05260" text-anchor="middle">Block / Reject</text>

  <g transform="translate(560, 250)">
    <rect width="260" height="60" rx="30" fill="#FFFFFF" stroke="#E05260" stroke-width="1.5" filter="url(#shadow)"/>
    <svg x="16" y="18" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#E05260" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><line x1="9.5" y1="9.5" x2="14.5" y2="14.5"/><line x1="14.5" y1="9.5" x2="9.5" y2="14.5"/>
    </svg>
    <text x="52" y="30" font-size="13" font-weight="700" fill="#E05260">DỪNG</text>
    <text x="52" y="46" font-size="11" fill="#64748B">giữ lại câu trả lời / báo lỗi</text>
  </g>

  <!-- Down Arrow 2 GREEN -->
  <path d="M 290 320 L 290 378" stroke="#22C55E" stroke-width="2" fill="none" marker-end="url(#arrow-green)"/>
  <rect x="298" y="338" width="105" height="22" rx="4" fill="#DCFCE7"/>
  <text x="350" y="353" font-size="11" font-weight="700" fill="#15803D" text-anchor="middle">Allow / Sanitize</text>

  <!-- Intermediate: Gọi LLM -->
  <g transform="translate(200, 380)">
    <rect width="180" height="60" rx="10" fill="#F1F5F9" stroke="#14B8A6" stroke-width="1.5" filter="url(#shadow)"/>
    <svg x="14" y="18" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#14B8A6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M15 2v2M15 20v2M2 15h2M2 9h2M20 15h2M20 9h2M9 2v2M9 20v2"/>
    </svg>
    <text x="46" y="35" font-size="14" font-weight="700" fill="#0F2A43">Gọi LLM</text>
    <text x="46" y="48" font-size="10" fill="#64748B">Inference Processing</text>
  </g>

  <path d="M 290 440 L 290 498" stroke="#22C55E" stroke-width="2" fill="none" marker-end="url(#arrow-green)"/>

  <!-- Guard 3: Output/DLP Guard -->
  <g transform="translate(180, 500)">
    <rect width="220" height="80" rx="12" fill="#FFFFFF" stroke="#0F2A43" stroke-width="1.5" filter="url(#shadow)"/>
    <svg x="16" y="16" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0F2A43" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
    </svg>
    <text x="50" y="38" font-size="15" font-weight="700" fill="#0F2A43">Output/DLP Guard</text>
    <text x="50" y="58" font-size="12" fill="#64748B">Kiểm tra rò rỉ dữ liệu</text>
  </g>

  <!-- Branch 3 RED -->
  <path d="M 400 540 L 550 540" stroke="#E05260" stroke-width="2" fill="none" marker-end="url(#arrow-red)"/>
  <rect x="425" y="520" width="90" height="22" rx="4" fill="#FEE2E2"/>
  <text x="470" y="535" font-size="11" font-weight="700" fill="#E05260" text-anchor="middle">Block / Reject</text>

  <g transform="translate(560, 510)">
    <rect width="260" height="60" rx="30" fill="#FFFFFF" stroke="#E05260" stroke-width="1.5" filter="url(#shadow)"/>
    <svg x="16" y="18" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#E05260" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><line x1="9.5" y1="9.5" x2="14.5" y2="14.5"/><line x1="14.5" y1="9.5" x2="9.5" y2="14.5"/>
    </svg>
    <text x="52" y="30" font-size="13" font-weight="700" fill="#E05260">DỪNG</text>
    <text x="52" y="46" font-size="11" fill="#64748B">giữ lại câu trả lời / báo lỗi</text>
  </g>

  <!-- Final Output -->
  <path d="M 290 580 L 290 638" stroke="#22C55E" stroke-width="2" fill="none" marker-end="url(#arrow-green)"/>
  <rect x="298" y="598" width="105" height="22" rx="4" fill="#DCFCE7"/>
  <text x="350" y="613" font-size="11" font-weight="700" fill="#15803D" text-anchor="middle">Allow / Sanitize</text>

  <g transform="translate(180, 640)">
    <rect width="220" height="70" rx="12" fill="#FFFFFF" stroke="#22C55E" stroke-width="2" filter="url(#shadow)"/>
    <svg x="16" y="22" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#22C55E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>
    </svg>
    <text x="52" y="35" font-size="15" font-weight="700" fill="#0F2A43">Trả lời</text>
    <text x="52" y="53" font-size="12" fill="#22C55E" font-weight="600">Phản hồi an toàn hoàn tất</text>
  </g>

  <!-- Chú thích -->
  <g transform="translate(180, 740)">
    <rect width="540" height="44" rx="8" fill="#CCFBF1" stroke="#14B8A6" stroke-width="1.5"/>
    <svg x="16" y="12" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0F2A43" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/>
    </svg>
    <text x="48" y="27" font-size="13" font-weight="700" fill="#0F2A43">Fail-closed — quyết định nghiêm khắc nhất thắng</text>
  </g>
</svg>
